<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs><style>.t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0F172A}.title{font-size:58px;font-weight:700}.sub{font-size:24px;fill:#475569}.layer{fill:#FFF;stroke:#CBD5E1;stroke-width:2}.db{fill:#F8FAFC;stroke:#CBD5E1;stroke-width:2}.txt{font-size:24px;font-weight:700}</style></defs>
  <rect width="1600" height="980" rx="28" fill="#F8FBFF"/>
  <text x="800" y="80" text-anchor="middle" class="t title">系统架构图 / System Architecture</text><text x="800" y="120" text-anchor="middle" class="t sub">创作权威沿固定 Artifact 链前进，外部资料库与审查节点独立协同</text>
  <rect x="120" y="160" width="330" height="90" rx="18" fill="#FFF" stroke="#D6E3FF"/><text x="285" y="215" text-anchor="middle" class="t txt">源小说 / Source Novel</text>
  <rect x="520" y="160" width="330" height="90" rx="18" fill="#FFF" stroke="#D6E3FF"/><text x="685" y="215" text-anchor="middle" class="t txt">项目设定 / Project Setup</text>
  <path d="M285 250 L285 300 L685 300 L685 250" fill="none" stroke="#64748B" stroke-width="4"/><path d="M485 300 L485 330" fill="none" stroke="#64748B" stroke-width="4"/>
  <g transform="translate(180,330)"><rect class="layer" width="760" height="64" rx="14" fill="#F5F3FF"/><text x="380" y="41" text-anchor="middle" class="t txt">1. Story Intelligence Layer（故事解剖）</text></g>
  <g transform="translate(180,410)"><rect class="layer" width="760" height="64" rx="14" fill="#EFF6FF"/><text x="380" y="41" text-anchor="middle" class="t txt">2. IP Knowledge Layer（IP 知识融合）</text></g>
  <g transform="translate(180,490)"><rect class="layer" width="760" height="64" rx="14" fill="#F0FDF4"/><text x="380" y="41" text-anchor="middle" class="t txt">3. Episode Planner（分集规划）</text></g>
  <g transform="translate(180,570)"><rect class="layer" width="760" height="64" rx="14" fill="#FFFBEB"/><text x="380" y="41" text-anchor="middle" class="t txt">4. Screenplay Generator（剧本生成）</text></g>
  <g transform="translate(180,650)"><rect class="layer" width="760" height="64" rx="14" fill="#FFF7ED"/><text x="380" y="41" text-anchor="middle" class="t txt">5. Shot / Generation / Timeline（镜头、生成与合成）</text></g>
  <g transform="translate(180,730)"><rect class="layer" width="760" height="64" rx="14" fill="#EEF2FF"/><text x="380" y="41" text-anchor="middle" class="t txt">6. Final MP4（成片输出）</text></g>
  <path d="M560 394 L560 410 M560 474 L560 490 M560 554 L560 570 M560 634 L560 650 M560 714 L560 730" stroke="#64748B" stroke-width="4"/>
  <rect x="1090" y="280" width="340" height="430" rx="24" fill="#FFF" stroke="#CBD5E1" stroke-dasharray="8 8"/><text x="1260" y="330" text-anchor="middle" class="t txt">外部资料库</text>
  <rect x="1145" y="370" width="230" height="72" rx="16" class="db"/><text x="1260" y="414" text-anchor="middle" class="t txt">ip_knowledge_index</text>
  <rect x="1145" y="485" width="230" height="72" rx="16" class="db"/><text x="1260" y="529" text-anchor="middle" class="t txt">ip_asset_manifest</text>
  <rect x="1145" y="600" width="230" height="72" rx="16" class="db"/><text x="1260" y="644" text-anchor="middle" class="t txt">ip_asset_registry</text>
  <path d="M940 442 L1145 406 M940 682 L1145 521 M940 682 L1145 636" fill="none" stroke="#64748B" stroke-width="3"/>
  <rect x="100" y="860" width="260" height="68" rx="16" fill="#F0FDF4" stroke="#86EFAC"/><text x="230" y="902" text-anchor="middle" class="t txt">Story Review</text>
  <rect x="460" y="860" width="280" height="68" rx="16" fill="#FFFBEB" stroke="#FCD34D"/><text x="600" y="902" text-anchor="middle" class="t txt">Screenplay Review</text>
  <rect x="850" y="860" width="320" height="68" rx="16" fill="#FEF2F2" stroke="#FCA5A5"/><text x="1010" y="902" text-anchor="middle" class="t txt">Generation-ready Review</text>
  <rect x="1240" y="860" width="230" height="68" rx="16" fill="#EEF2FF" stroke="#A5B4FC"/><text x="1355" y="902" text-anchor="middle" class="t txt">Final Review</text>
</svg>
