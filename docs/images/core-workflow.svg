  <g transform="translate(850,210)"><rect class="box" width="220" height="180" rx="24"/><text x="110" y="54" text-anchor="middle" class="t n">4</text><text x="110" y="105" text-anchor="middle" class="t p">Story 人工确认</text></g>
  <g transform="translate(1110,210)"><rect class="box" width="220" height="180" rx="24"/><text x="110" y="54" text-anchor="middle" class="t n">5</text><text x="110" y="105" text-anchor="middle" class="t p">分集设计</text></g>
  <g transform="translate(1370,210)"><rect class="box" width="160" height="180" rx="24"/><text x="80" y="54" text-anchor="middle" class="t n">6</text><text x="80" y="105" text-anchor="middle" class="t p">正式剧本</text></g>
  <path d="M290 300 L330 300 M550 300 L590 300 M810 300 L850 300 M1070 300 L1110 300 M1330 300 L1370 300" stroke="#5A62FF" stroke-width="6" stroke-linecap="round"/>
  <path d="M1450 410 C1450 470 1450 500 1360 500 L210 500 C120 500 120 530 120 560" fill="none" stroke="#7C8CFF" stroke-width="4" stroke-dasharray="10 10"/>
  <g transform="translate(100,560)"><rect class="box" width="280" height="180" rx="24"/><text x="140" y="54" text-anchor="middle" class="t n">7</text><text x="140" y="96" text-anchor="middle" class="t p">导演 / 资产 / 声音</text><text x="140" y="130" text-anchor="middle" class="t p">/ 镜头设计</text></g>
  <g transform="translate(440,560)"><rect class="box" width="240" height="180" rx="24"/><text x="120" y="54" text-anchor="middle" class="t n">8</text><text x="120" y="105" text-anchor="middle" class="t p">生成前独立审查</text></g>
  <g transform="translate(740,560)"><rect class="box" width="220" height="180" rx="24"/><text x="110" y="54" text-anchor="middle" class="t n">9</text><text x="110" y="105" text-anchor="middle" class="t p">预告样片验证</text></g>
