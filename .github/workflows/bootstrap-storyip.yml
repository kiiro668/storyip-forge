name: Bootstrap StoryIP Forge

on:
  push:
    paths:
      - '.bootstrap/ready'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize StoryIP Forge v0.17.0
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* > /tmp/storyip-forge.b64
          base64 -d /tmp/storyip-forge.b64 > /tmp/storyip-forge.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/storyip-forge.tar.gz -C .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'release: StoryIP Forge v0.17.0'
          git push origin HEAD:main
