<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860">
  <defs><style>.t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0F172A}.title{font-size:60px;font-weight:700}.sub{font-size:24px;fill:#475569}.box{fill:#FFF;stroke:#D6E3FF;stroke-width:2}.n{font-size:28px;font-weight:700;fill:#2563EB}.p{font-size:24px;font-weight:700}.tag{font-size:22px;font-weight:700}</style></defs>
  <rect width="1600" height="860" rx="28" fill="#F7FAFF"/>
  <text x="800" y="90" text-anchor="middle" class="t title">核心工作流 / Core Workflow</text><text x="800" y="132" text-anchor="middle" class="t sub">从项目设定到 final.mp4 的最小生产链</text>
  <g transform="translate(70,210)"><rect class="box" width="220" height="180" rx="24"/><text x="110" y="54" text-anchor="middle" class="t n">1</text><text x="110" y="105" text-anchor="middle" class="t p">项目设定</text></g>
  <g transform="translate(330,210)"><rect class="box" width="220" height="180" rx="24"/><text x="110" y="54" text-anchor="middle" class="t n">2</text><text x="110" y="105" text-anchor="middle" class="t p">全文故事解剖</text></g>
